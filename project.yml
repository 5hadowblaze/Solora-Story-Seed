name: SoloraStorySeed
options:
  bundleIdPrefix: com.amirdzakwan
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.19.3
targets:
  SoloraStorySeed:
    type: application
    platform: iOS
    sources:
      - path: SoloraStorySeed
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirdzakwan.solora.storyseed
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  SoloraStorySeedMac:
    type: application
    platform: macOS
    sources:
      - path: SoloraStorySeed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirdzakwan.solora.storyseed.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  SoloraStorySeedMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: SoloraStorySeedMac
