name: SoloraStorySeedLocal
options:
  bundleIdPrefix: com.amirdzakwan
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  SoloraStorySeed:
    type: application
    platform: iOS
    sources:
      - path: SoloraStorySeed
        excludes:
          - GoogleService-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirdzakwan.solora.storyseed
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  SoloraStorySeedMac:
    type: application
    platform: macOS
    sources:
      - path: SoloraStorySeed
        excludes:
          - GoogleService-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirdzakwan.solora.storyseed.mac
  SoloraStorySeedMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: SoloraStorySeedMac
